name: Bootstrap scaffold (create branch + PR with PAT)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create branch, files and PR (via GitHub API using PAT)
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.PERSONAL_TOKEN }}
          script: |
            const { owner, repo } = context.repo;

            // fetch default branch
            const repoInfo = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repoInfo.data.default_branch;

            const branch = 'bootstrap/scaffold';

            // get base commit sha
            const baseRef = await github.rest.git.getRef({ owner, repo, ref: `heads/${defaultBranch}` });
            const baseSha = baseRef.data.object.sha;

            // create branch if missing
            let branchExists = true;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            } catch (e) {
              branchExists = false;
            }
            if (!branchExists) {
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: baseSha });
              console.log(`Created branch ${branch}`);
            } else {
              console.log(`Branch ${branch} already exists`);
            }

            // Files to create (path -> array of lines)
            const files = {
              ".gitignore": [
                "/node_modules",
                ".env",
                ".DS_Store",
                "/*.log",
                "/data"
              ],
              "package.json": [
                "{",
                '  "name": "exam-os-actions",',
                '  "version": "0.1.0",',
                '  "private": true,',
                '  "type": "module",',
                '  "scripts": {',
                '    "send-otp": "node scripts/send-otp.js",',
                '    "verify-otp": "node scripts/verify-otp.js",',
                '    "submit-attempt": "node scripts/submit-attempt.js"',
                '  },',
                '  "dependencies": {',
                '    "nodemailer": "^6.9.4",',
                '    "fs-extra": "^11.1.1"',
                '  }',
                "}"
              ],
              "scripts/send-otp.js": [
                "#!/usr/bin/env node",
                "import fs from 'fs-extra';",
                "import path from 'path';",
                "import crypto from 'crypto';",
                "import nodemailer from 'nodemailer';",
                "",
                "const eventPath = process.argv[2] || process.env.GITHUB_EVENT_PATH;",
                "if (!eventPath || !fs.existsSync(eventPath)) {",
                "  console.error('Missing GITHUB_EVENT_PATH or event file not provided');",
                "  process.exit(1);",
                "}",
                "",
                "const event = await fs.readJson(eventPath);",
                "const payload = event.client_payload || {};",
                "const email = (payload.email || '').toLowerCase();",
                "if (!email) {",
                "  console.error('No email provided in client_payload');",
                "  process.exit(1);",
                "}",
                "",
                "const otp = ('' + Math.floor(100000 + Math.random() * 900000));",
                "const salt = crypto.randomBytes(16).toString('hex');",
                "const hash = crypto.createHmac('sha256', salt).update(otp).digest('hex');",
                "const expiresAt = new Date(Date.now() + 2 * 60 * 60 * 1000).toISOString();",
                "",
                "const otpRecord = { email, hash, salt, expiresAt, createdAt: new Date().toISOString() };",
                "",
                "const otpsDir = path.join(process.cwd(), 'data', 'otps');",
                "await fs.ensureDir(otpsDir);",
                "const safeFileName = email.replace(/[^a-z0-9@.\\-]/gi, '_');",
                "const filePath = path.join(otpsDir, `${safeFileName}.json`);",
                "await fs.writeJson(filePath, otpRecord, { spaces: 2 });",
                "console.log(`Wrote OTP record to ${filePath}`);",
                "",
                "const smtpHost = process.env.SMTP_HOST;",
                "const smtpPort = process.env.SMTP_PORT || 587;",
                "const smtpUser = process.env.SMTP_USER;",
                "const smtpPass = process.env.SMTP_PASS;",
                "",
                "if (!smtpHost || !smtpUser || !smtpPass) {",
                "  console.warn('SMTP credentials not fully set. Skipping sending email. OTP is:', otp);",
                "  process.exit(0);",
                "}",
                "",
                "const transporter = nodemailer.createTransport({",
                "  host: smtpHost,",
                "  port: Number(smtpPort),",
                "  secure: Number(smtpPort) === 465,",
                "  auth: { user: smtpUser, pass: smtpPass }",
                "});",
                "",
                "const mailText = 'Your exam login code is: ' + otp + '\\n\\nValid for 2 hours.';",
                "",
                "try {",
                "  const res = await transporter.sendMail({ from: process.env.SMTP_USER, to: email, subject: 'Your exam login code', text: mailText });",
                "  console.log('Email sent', res && res.messageId);",
                "} catch (err) {",
                "  console.error('Error sending email', err);",
                "  console.error('OTP for', email, 'is', otp);",
                "  process.exit(1);",
                "}"
              ],
              "scripts/verify-otp.js": [
                "#!/usr/bin/env node",
                "import fs from 'fs-extra';",
                "import path from 'path';",
                "import crypto from 'crypto';",
                "",
                "const eventPath = process.argv[2] || process.env.GITHUB_EVENT_PATH;",
                "if (!eventPath || !fs.existsSync(eventPath)) {",
                "  console.error('Missing GITHUB_EVENT_PATH or event file not provided');",
                "  process.exit(1);",
                "}",
                "",
                "const event = await fs.readJson(eventPath);",
                "const payload = event.client_payload || {};",
                "const email = (payload.email || '').toLowerCase();",
                "const code = (payload.code || '').toString();",
                "const examSlug = payload.exam_slug || 'sample-exam';",
                "",
                "if (!email || !code) {",
                "  console.error('Missing email or code in client_payload');",
                "  process.exit(1);",
                "}",
                "",
                "const otpsDir = path.join(process.cwd(), 'data', 'otps');",
                "const safeFileName = email.replace(/[^a-z0-9@.\\-]/gi, '_');",
                "const filePath = path.join(otpsDir, `${safeFileName}.json`);",
                "if (!fs.existsSync(filePath)) {",
                "  console.error('No OTP found for', email);",
                "  process.exit(1);",
                "}",
                "",
                "const otpRecord = await fs.readJson(filePath);",
                "if (new Date(otpRecord.expiresAt) < new Date()) {",
                "  console.error('OTP expired');",
                "  process.exit(1);",
                "}",
                "",
                "const hash = crypto.createHmac('sha256', otpRecord.salt).update(code).digest('hex');",
                "if (hash !== otpRecord.hash) {",
                "  console.error('Invalid OTP code');",
                "  process.exit(1);",
                "}",
                "",
                "const questionsDir = path.join(process.cwd(), 'data', 'questions');",
                "const examFile = path.join(questionsDir, `${examSlug}.json`);",
                "if (!fs.existsSync(examFile)) {",
                "  console.error('Exam not found:', examSlug);",
                "  process.exit(1);",
                "}",
                "",
                "const examData = await fs.readJson(examFile);",
                "const pool = examData.questions || [];",
                "if (pool.length === 0) {",
                "  console.error('No questions in exam');",
                "  process.exit(1);",
                "}",
                "",
                "function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } }",
                "",
                "const poolCopy = [...pool];",
                "shuffle(poolCopy);",
                "const selected = poolCopy.slice(0, Math.min(50, poolCopy.length));",
                "",
                "const attemptId = crypto.randomUUID();",
                "const attempt = { id: attemptId, email, examSlug, questionIds: selected.map(q=>q.id), startedAt: new Date().toISOString(), finishedAt: null, answers: [], score: null };",
                "",
                "const attemptsDir = path.join(process.cwd(), 'data', 'attempts');",
                "await fs.ensureDir(attemptsDir);",
                "const attemptPath = path.join(attemptsDir, `${attemptId}.json`);",
                "await fs.writeJson(attemptPath, attempt, { spaces: 2 });",
                "otpRecord.used = true;",
                "await fs.writeJson(filePath, otpRecord, { spaces: 2 });",
                "console.log('Created attempt', attemptId);",
                "console.log(JSON.stringify({ attemptId }));"
              ],
              "scripts/submit-attempt.js": [
                "#!/usr/bin/env node",
                "import fs from 'fs-extra';",
                "import path from 'path';",
                "",
                "const eventPath = process.argv[2] || process.env.GITHUB_EVENT_PATH;",
                "if (!eventPath || !fs.existsSync(eventPath)) {",
                "  console.error('Missing GITHUB_EVENT_PATH or event file not provided');",
                "  process.exit(1);",
                "}",
                "",
                "const event = await fs.readJson(eventPath);",
                "const payload = event.client_payload || {};",
                "const attemptId = payload.attemptId;",
                "const answers = payload.answers || [];",
                "",
                "if (!attemptId) {",
                "  console.error('No attemptId provided');",
                "  process.exit(1);",
                "}",
                "",
                "const attemptsDir = path.join(process.cwd(), 'data', 'attempts');",
                "const attemptPath = path.join(attemptsDir, `${attemptId}.json`);",
                "if (!fs.existsSync(attemptPath)) {",
                "  console.error('Attempt file not found:', attemptPath);",
                "  process.exit(1);",
                "}",
                "",
                "const attempt = await fs.readJson(attemptPath);",
                "if (attempt.finishedAt) {",
                "  console.error('Attempt already finished');",
                "  process.exit(1);",
                "}",
                "",
                "const questionsFile = path.join(process.cwd(), 'data', 'questions', `${attempt.examSlug}.json`);",
                "const examData = await fs.readJson(questionsFile);",
                "const questionsById = {}; for (const q of examData.questions) questionsById[q.id] = q;",
                "",
                "let correctCount = 0;",
                "const detailed = [];",
                "for (const ans of answers) {",
                "  const q = questionsById[ans.questionId]; if (!q) continue;",
                "  const selected = q.options.find(o=>o.id === ans.selectedOptionId);",
                "  const correctOption = q.options.find(o=>o.isCorrect);",
                "  const correct = selected && selected.id === (correctOption && correctOption.id);",
                "  if (correct) correctCount++;",
                "  detailed.push({ questionId: q.id, selectedOptionId: (selected? selected.id : null), correct, timeTaken: ans.timeTaken || null });",
                "}",
                "attempt.answers = detailed;",
                "attempt.score = Math.round((correctCount / attempt.questionIds.length) * 100);",
                "attempt.finishedAt = new Date().toISOString();",
                "if (attempt.startedAt) { const started = new Date(attempt.startedAt); const finished = new Date(attempt.finishedAt); attempt.durationSeconds = Math.round((finished - started) / 1000); }",
                "await fs.writeJson(attemptPath, attempt, { spaces: 2 });",
                "console.log('Graded attempt', attemptId, 'score=', attempt.score);"
              ],
              "data/questions/sample-exam.json": [
                "{",
                '  \"slug\":\"sample-exam\",',
                '  \"title\":\"Sample Exam\",',
                '  \"description\":\"A small sample exam\",',
                '  \"questions\": [',
                '    {\"id\":\"q1\",\"text\":\"What does HTTP stand for?\",\"options\":[{\"id\":\"q1a\",\"text\":\"HyperText Transfer Protocol\",\"isCorrect\":true},{\"id\":\"q1b\",\"text\":\"Hyperlink Transfer Protocol\",\"isCorrect\":false}]},',
                '    {\"id\":\"q2\",\"text\":\"Which port does HTTPS use by default?\",\"options\":[{\"id\":\"q2a\",\"text\":\"80\",\"isCorrect\":false},{\"id\":\"q2b\",\"text\":\"443\",\"isCorrect\":true}]}',
                '  ]',
                "}"
              ]
            };

            // create/update files on the branch
            for (const [path, lines] of Object.entries(files)) {
              const content = lines.join("\n");
              const encoded = Buffer.from(content, "utf8").toString("base64");

              try {
                // check if file exists on the branch
                await github.rest.repos.getContent({ owner, repo, path, ref: branch });
                console.log(`${path} already exists on ${branch}, skipping create`);
              } catch (err) {
                // create the file on the branch
                await github.rest.repos.createOrUpdateFileContents({
                  owner,
                  repo,
                  path,
                  message: `Add ${path}`,
                  content: encoded,
                  branch
                });
                console.log(`Created ${path} on ${branch}`);
              }
            }

            // create a PR from branch -> defaultBranch
            const title = "Bootstrap scaffold: add scripts and sample data";
            const body = "This PR was created by an automated bootstrap workflow and adds initial scripts and a sample exam.";
            const pr = await github.rest.pulls.create({
              owner,
              repo,
              title,
              head: branch,
              base: defaultBranch,
              body
            });
            console.log(`Created PR: ${pr.data.html_url}`);
            return pr.data.html_url;
