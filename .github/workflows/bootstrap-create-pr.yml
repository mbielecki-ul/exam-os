name: Bootstrap scaffold (create branch + PR)

on: workflow_dispatch:

permissions: contents: write

jobs: bootstrap-pr: runs-on: ubuntu-latest steps: - name: Checkout uses: actions/checkout@v4 with: persist-credentials: true

Code
  - name: Create directories
    run: |
      mkdir -p scripts
      mkdir -p data/questions
      mkdir -p data/otps
      mkdir -p data/attempts

  - name: Create .gitignore
    run: |
      if [ ! -f .gitignore ]; then
        printf '%s\n' "/node_modules" ".env" ".DS_Store" "/*.log" "/data" > .gitignore
      else
        echo ".gitignore exists, skipping"
      fi

  - name: Create package.json
    run: |
      if [ ! -f package.json ]; then
        cat > package.json <<'JSON'
{ "name": "exam-os-actions", "version": "0.1.0", "private": true, "type": "module", "scripts": { "send-otp": "node scripts/send-otp.js", "verify-otp": "node scripts/verify-otp.js", "submit-attempt": "node scripts/submit-attempt.js" }, "dependencies": { "nodemailer": "^6.9.4", "fs-extra": "^11.1.1" } } JSON else echo "package.json exists, skipping" fi

Code
  - name: Create scripts/send-otp.js
    run: |
      if [ ! -f scripts/send-otp.js ]; then
        cat > scripts/send-otp.js <<'JS'
#!/usr/bin/env node import fs from 'fs-extra'; import path from 'path'; import crypto from 'crypto'; import nodemailer from 'nodemailer';

const eventPath = process.argv[2] || process.env.GITHUB_EVENT_PATH; if (!eventPath || !fs.existsSync(eventPath)) { console.error('Missing GITHUB_EVENT_PATH or event file not provided'); process.exit(1); }

const event = await fs.readJson(eventPath); const payload = event.client_payload || {}; const email = (payload.email || '').toLowerCase(); if (!email) { console.error('No email provided'); process.exit(1); }

const otp = ('' + Math.floor(100000 + Math.random() * 900000)); const salt = crypto.randomBytes(16).toString('hex'); const hash = crypto.createHmac('sha256', salt).update(otp).digest('hex'); const expiresAt = new Date(Date.now() + 2 * 60 * 60 * 1000).toISOString(); const otpRecord = { email, hash, salt, expiresAt, createdAt: new Date().toISOString() };

const otpsDir = path.join(process.cwd(), 'data', 'otps'); await fs.ensureDir(otpsDir); const safeFileName = email.replace(/[^a-z0-9@.-]/gi, '_'); const filePath = path.join(otpsDir, ${safeFileName}.json); await fs.writeJson(filePath, otpRecord, { spaces: 2 });

const smtpHost = process.env.SMTP_HOST; const smtpPort = process.env.SMTP_PORT || 587; const smtpUser = process.env.SMTP_USER; const smtpPass = process.env.SMTP_PASS;

if (!smtpHost || !smtpUser || !smtpPass) { console.warn('SMTP not configured; OTP is:', otp); process.exit(0); }

const transporter = nodemailer.createTransport({ host: smtpHost, port: Number(smtpPort), secure: Number(smtpPort) === 465, auth: { user: smtpUser, pass: smtpPass } });

const mailText = Your exam login code is: ${otp}\n\nValid for 2 hours.; try { await transporter.sendMail({ from: process.env.SMTP_USER, to: email, subject: 'Your exam login code', text: mailText }); console.log('Email sent'); } catch (err) { console.error('Error sending email', err); console.error('OTP for', email, 'is', otp); process.exit(1); } JS else echo "scripts/send-otp.js exists, skipping" fi

Code
  - name: Create scripts/verify-otp.js
    run: |
      if [ ! -f scripts/verify-otp.js ]; then
        cat > scripts/verify-otp.js <<'JS'
#!/usr/bin/env node import fs from 'fs-extra'; import path from 'path'; import crypto from 'crypto';

const eventPath = process.argv[2] || process.env.GITHUB_EVENT_PATH; if (!eventPath || !fs.existsSync(eventPath)) { console.error('Missing event'); process.exit(1); } const event = await fs.readJson(eventPath); const p = event.client_payload || {}; const email = (p.email || '').toLowerCase(); const code = (p.code || '').toString(); const examSlug = p.exam_slug || 'sample-exam'; if (!email || !code) { console.error('Missing email or code'); process.exit(1); }

const otpsDir = path.join(process.cwd(), 'data', 'otps'); const filePath = path.join(otpsDir, ${email.replace(/[^a-z0-9@.\-]/gi, '_')}.json); if (!fs.existsSync(filePath)) { console.error('No OTP'); process.exit(1); } const otpRecord = await fs.readJson(filePath); if (new Date(otpRecord.expiresAt) < new Date()) { console.error('OTP expired'); process.exit(1); } const hash = crypto.createHmac('sha256', otpRecord.salt).update(code).digest('hex'); if (hash !== otpRecord.hash) { console.error('Invalid OTP'); process.exit(1); }

const questionsFile = path.join(process.cwd(), 'data', 'questions', ${examSlug}.json); if (!fs.existsSync(questionsFile)) { console.error('Exam not found'); process.exit(1); } const examData = await fs.readJson(questionsFile); const pool = examData.questions || []; if (pool.length === 0) { console.error('No questions'); process.exit(1); }

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } } const poolCopy = [...pool]; shuffle(poolCopy); const selected = poolCopy.slice(0, Math.min(50, poolCopy.length)); const attemptId = crypto.randomUUID(); const attempt = { id: attemptId, email, examSlug, questionIds: selected.map(q=>q.id), startedAt: new Date().toISOString(), finishedAt: null, answers: [], score: null }; const attemptsDir = path.join(process.cwd(), 'data', 'attempts'); await fs.ensureDir(attemptsDir); await fs.writeJson(path.join(attemptsDir, ${attemptId}.json), attempt, { spaces: 2 }); otpRecord.used = true; await fs.writeJson(filePath, otpRecord, { spaces: 2 }); console.log(JSON.stringify({ attemptId })); JS else echo "scripts/verify-otp.js exists, skipping" fi

Code
  - name: Create scripts/submit-attempt.js
    run: |
      if [ ! -f scripts/submit-attempt.js ]; then
        cat > scripts/submit-attempt.js <<'JS'
#!/usr/bin/env node import fs from 'fs-extra'; import path from 'path';

const eventPath = process.argv[2] || process.env.GITHUB_EVENT_PATH; if (!eventPath || !fs.existsSync(eventPath)) { console.error('Missing event'); process.exit(1); } const event = await fs.readJson(eventPath); const p = event.client_payload || {}; const attemptId = p.attemptId; const answers = p.answers || []; if (!attemptId) { console.error('No attemptId'); process.exit(1); }

const attemptsDir = path.join(process.cwd(), 'data', 'attempts'); const attemptPath = path.join(attemptsDir, ${attemptId}.json); if (!fs.existsSync(attemptPath)) { console.error('Attempt not found'); process.exit(1); } const attempt = await fs.readJson(attemptPath); if (attempt.finishedAt) { console.error('Already finished'); process.exit(1); }

const qFile = path.join(process.cwd(), 'data', 'questions', ${attempt.examSlug}.json); const examData = await fs.readJson(qFile); const questionsById = {}; for (const q of examData.questions) questionsById[q.id] = q;

let correctCount = 0; const detailed = []; for (const ans of answers) { const q = questionsById[ans.questionId]; if (!q) continue; const selected = q.options.find(o=>o.id === ans.selectedOptionId); const correctOption = q.options.find(o=>o.isCorrect); const correct = selected && selected.id === correctOption.id; if (correct) correctCount++; detailed.push({ questionId: q.id, selectedOptionId: (selected? selected.id : null), correct, timeTaken: ans.timeTaken || null }); } attempt.answers = detailed; attempt.score = Math.round((correctCount / attempt.questionIds.length) * 100); attempt.finishedAt = new Date().toISOString(); if (attempt.startedAt) { const started = new Date(attempt.startedAt); const finished = new Date(attempt.finishedAt); attempt.durationSeconds = Math.round((finished - started) / 1000); } await fs.writeJson(attemptPath, attempt, { spaces: 2 }); console.log('Graded', attemptId, 'score=', attempt.score); JS else echo "scripts/submit-attempt.js exists, skipping" fi

Code
  - name: Create sample exam JSON
    run: |
      if [ ! -f data/questions/sample-exam.json ]; then
        cat > data/questions/sample-exam.json <<'JSON'
{ "slug":"sample-exam","title":"Sample Exam","description":"A small sample exam","questions":[ {"id":"q1","text":"What does HTTP stand for?","options":[{"id":"q1a","text":"HyperText Transfer Protocol","isCorrect":true},{"id":"q1b","text":"Hyperlink Transfer Protocol","isCorrect":false}]}, {"id":"q2","text":"Which port does HTTPS use by default?","options":[{"id":"q2a","text":"80","isCorrect":false},{"id":"q2b","text":"443","isCorrect":true}]} ] } JSON else echo "sample-exam.json exists, skipping" fi

Code
  - name: Make scripts executable
    run: chmod +x scripts/*.js || true

  - name: Create branch, commit and push
    env:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
    run: |
      BRANCH=bootstrap/scaffold
      git config user.name "github-actions[bot]"
      git config user.email "github-actions[bot]@users.noreply.github.com"
      git checkout -b $BRANCH || git checkout $BRANCH
      git add .
      git commit -m "Bootstrap scaffold: add scripts and sample data" || echo "no changes"
      git remote set-url origin https://x-access-token:${TOKEN}@github.com/${{ github.repository }}
      git push --set-upstream origin $BRANCH

  - name: Create PR
    env:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
    run: |
      PR_TITLE="Bootstrap scaffold: add scripts and sample data"
      PR_BODY="This PR was created by the bootstrap workflow and adds initial scripts and sample exam data."
      API_URL="https://api.github.com/repos/${{ github.repository }}/pulls"
      DATA=$(jq -n --arg title "$PR_TITLE" --arg head "bootstrap/scaffold" --arg base "${{ github.ref_name }}" --arg body "$PR_BODY" '{title:$title,head:$head,base:$base,body:$body}')
      curl -s -X POST -H "Authorization: token ${TOKEN}" -H "Accept: application/vnd.github+json" $API_URL -d "$DATA" | jq -r '.html_url'
    shell: bash
