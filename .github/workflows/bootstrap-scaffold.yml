          else
            echo "sample-exam.json already exists, skipping"
          fi

      - name: Make scripts executable
        run: |
          chmod +x scripts/*.js || true

      - name: Commit scaffold
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add . || true
          git commit -m "Bootstrap scaffold: add workflows, scripts, sample data, package.json, .gitignore" || echo "no changes to commit"
          git push || echo "push failed"

      - name: Done
        run: echo "Bootstrap complete. Check repository for added scaffold files."
