name: Deploy Firestore rules

# Publishes firestore.rules to the Firebase project whenever the rules
# (or this workflow, or firebase.json) change on main. Can also be run
# by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - .github/workflows/deploy-firestore-rules.yml
  workflow_dispatch:

permissions:
  contents: read

# Never let two rule deploys race each other.
concurrency:
  group: firestore-rules
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install -g firebase-tools@13

      # firebase-tools reads GOOGLE_APPLICATION_CREDENTIALS as a path to a
      # service-account key file, so materialise the secret to disk first.
      - name: Write service account key
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy rules
        run: firebase deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json

      - name: Clean up key
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
