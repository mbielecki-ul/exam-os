name: Deploy Cloud Functions

# Publishes functions/ (the result-email trigger) to Firebase whenever it
# changes on main. Can also be run by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - functions/**
      - firebase.json
      - .github/workflows/deploy-functions.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # The CLI loads the functions code locally to discover triggers.
      - run: npm ci
        working-directory: functions

      - run: npm install -g firebase-tools@15

      # Function parameters (see defineString() in functions/index.js). Kept
      # out of the repo because it's public; written fresh on every deploy.
      - name: Write functions/.env
        run: |
          {
            echo "RESULT_EMAIL_TO=$RESULT_EMAIL_TO"
            echo "MAIL_TIMEZONE=${MAIL_TIMEZONE:-UTC}"
            echo "FUNCTIONS_REGION=${FUNCTIONS_REGION:-us-central1}"
          } > functions/.env
        env:
          RESULT_EMAIL_TO: ${{ secrets.RESULT_EMAIL_TO }}
          MAIL_TIMEZONE: ${{ vars.MAIL_TIMEZONE }}
          FUNCTIONS_REGION: ${{ vars.FUNCTIONS_REGION }}

      - name: Write service account key
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Without a cleanup policy for the function's container images the
      # non-interactive deploy exits with an error (after deploying). Setting
      # it is idempotent; it can only fail before the very first deploy
      # created the image repository, hence continue-on-error.
      - name: Ensure container image cleanup policy
        continue-on-error: true
        run: firebase functions:artifacts:setpolicy --location "${FUNCTIONS_REGION:-us-central1}" --days 1 --force --project "$FIREBASE_PROJECT_ID" --non-interactive
        env:
          FUNCTIONS_REGION: ${{ vars.FUNCTIONS_REGION }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json

      # No --force: that would also let the CLI delete functions it doesn't
      # recognise. Extension-owned functions are left alone either way.
      - name: Deploy functions
        run: firebase deploy --only functions --project "$FIREBASE_PROJECT_ID" --non-interactive
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json

      - name: Clean up key and env
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json" functions/.env
